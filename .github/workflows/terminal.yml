name: terminal
run-name: job
on:
  workflow_dispatch:
    inputs:
      payload: { required: true, type: string }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: decrypt
        run: node decrypt.mjs
        env: { RUNNER_KEY: "${{ secrets.RUNNER_KEY }}", PAYLOAD: "${{ inputs.payload }}" }
      - name: work
        run: |
          # No errexit: a job that fails (e.g. exit 127) must still reach the callback, or the bot waits 20 min for nothing.
          set +e
          . /tmp/job.env
          git config --global user.email agent@stitchnscale.local; git config --global user.name stitchnscale-agent
          U="https://x-access-token:$GH@github.com/$REPO.git"
          cd ~ && (git clone -q --depth 1 -b space "$U" space >/dev/null 2>&1 || (mkdir -p space && cd space && git init -q -b space && git remote add origin "$U"))
          cd ~/space
          (export GH= ; timeout 600 bash /tmp/job.sh) > /tmp/out.txt 2>&1; echo "EXIT=$?" >> /tmp/out.txt
          find . -size +50M -not -path './.git/*' -delete || true
          # keep clones as plain files: nested .git dirs become empty 'gitlinks' (content lost) and hold token-bearing remote URLs
          git ls-files -s | awk '$1==160000{print $4}' | xargs -r git rm -q --cached >/dev/null 2>&1 || true
          find . -mindepth 2 -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name node_modules -prune -not -path './.git/*' -exec rm -rf {} + 2>/dev/null || true
          git add -A >/dev/null 2>&1; F=$(git diff --cached --name-only | head -20); if [ -n "$F" ]; then printf '\nFILES CREATED OR CHANGED (send with send_file):\n%s\n' "$F" >> /tmp/out.txt; fi
          if [ -n "$F" ]; then git commit -qm job >/dev/null 2>&1; { git push -q origin space || { git pull -q --rebase origin space && git push -q origin space; }; } > /tmp/push.txt 2>&1 || { echo "WORKSPACE SAVE FAILED:"; sed "s/$GH/***/g" /tmp/push.txt | tail -5; } >> /tmp/out.txt; fi
          if [ $(wc -c < /tmp/out.txt) -gt 8500 ]; then { head -c 3000 /tmp/out.txt; printf '\n...\n'; tail -c 5000 /tmp/out.txt; } > /tmp/o2.txt; else cp /tmp/out.txt /tmp/o2.txt; fi
          OK=false; grep -q '^EXIT=0$' /tmp/out.txt && OK=true
          jq -n --arg id "$JOB_ID" --rawfile t /tmp/o2.txt --argjson ok $OK '{job_id:$id, ok:$ok, final_url:"terminal", text:$t}' | curl -s -X POST "$CALLBACK_URL" -H 'content-type: application/json' -d @- >/dev/null
          echo done
